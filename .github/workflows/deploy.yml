name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # 3시간마다 구글 문서를 다시 확인해서 사이트를 갱신합니다.
    # 더 자주/덜 자주 갱신하고 싶다면 cron 값을 수정하세요.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Commit and push generated site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild site from Google Docs"
          file_pattern: "docs/**"
