name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [doc-updated]
  schedule:
    # 만약을 대비한 안전망 (구글 스크립트가 실패하는 경우를 대비해 6시간마다 확인)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Commit and push generated site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild site from Google Docs"
          file_pattern: "docs/**"
